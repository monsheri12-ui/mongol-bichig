<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Монгол бичиг — учимся читать</title><style>body{margin:0;background:#f7f7f5;color:#27332b;font:16px/1.5 system-ui}#app>p{padding:30px}</style><style id="trainer-loading-styles">.nu-loading {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100svh;
  padding: clamp(20px, 5vw, 48px);
  place-items: center;
  background: radial-gradient(ellipse at 50% 42%, #FFFCF5 0%, #F6F0E4 72%);
  color: #23455E;
  font: 16px/1.5 Arial, Helvetica, sans-serif;
  text-align: center;
}

.nu-loading-panel {
  width: min(100%, 366px);
}

.nu-loading-art {
  box-sizing: border-box;
  position: relative;
  padding: 8px;
  margin-bottom: clamp(20px, 5vw, 30px);
  border: 1px solid #DCCDB3;
  border-radius: 16px;
  background: #FFFCF5;
}

.nu-loading-art img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  border-radius: 10px;
  background: #EDE2CB;
}

.nu-loading .nu-loading-title {
  margin: 0;
  font: 700 clamp(29px, 7vw, 39px)/1.15 Arial, Helvetica, sans-serif;
  letter-spacing: -.035em;
}

.nu-loading .nu-loading-status {
  max-width: 31ch;
  margin: 11px auto 0;
  color: #655C4D;
  font: 400 16px/1.55 Arial, Helvetica, sans-serif;
}

.nu-loading-track {
  position: relative;
  overflow: hidden;
  width: 90px;
  height: 3px;
  margin: 18px auto 0;
  border-radius: 10px;
  background: #E8D9BE;
}

.nu-loading-track span {
  display: block;
  width: 38%;
  height: 100%;
  border-radius: inherit;
  background: #AB5942;
  animation: nu-loading-sweep 1.9s ease-in-out infinite;
}

@keyframes nu-loading-sweep {
  from { transform: translateX(-110%); }
  to { transform: translateX(275%); }
}

.nu-loading-retry {
  min-height: 44px;
  margin-top: 18px;
  padding: 9px 22px;
  border: 1px solid #23455E;
  border-radius: 9px;
  background: #23455E;
  color: #FFFCF5;
  font: 600 15px/1.4 Arial, Helvetica, sans-serif;
  cursor: pointer;
}

.nu-loading-retry[hidden],
.nu-loading[data-loader-state="error"] .nu-loading-track {
  display: none;
}

.nu-loading-retry:hover { background: #1A3548; }

.nu-loading-retry:focus-visible {
  outline: 2px solid #AB5942;
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .nu-loading-track span {
    margin-inline: auto;
    animation: none;
  }
}

#app .nu-header,

#app .nu-header {

const esc = value => {
    const span = document.createElement("span");
    span.textContent = value;
    return span.innerHTML;
};
const starterKey = 'mongol-first-lesson-v1';
const starterSteps = [
    'direction', 'forms', 'mouth', 'find-start', 'find-end', 'independent', 'phrase', 'done'
];

function readStarterSave() {
    try {
        const saved = JSON.parse(localStorage.getItem(starterKey));
        return starterSteps.includes(saved?.step) && Array.isArray(saved.solved) ? saved : null;
    } catch {
        return null;
    }
}

function homeStartCard(label, description, href) {
    return '<a class="mg-study-card" href="' + href + '"><span><strong>' + esc(label)
        + '</strong><span class="mg-study-description">' + esc(description) + '</span></span>'
        + '<span class="mg-study-arrow" aria-hidden="true">→</span></a>';
}

function renderReadingHome(markup, step) {
    const finished = step === 'done';
    const href = finished ? '#reading-track' : '#first-lesson/' + (step || starterSteps[0]);
    const label = finished ? 'Продолжить обучение' : step ? 'Продолжить первый урок' : 'Начать с первого урока';
    const link = '<a class="starter-home-link" href="' + href + '">' + label + '</a>';
    const cards = '<nav class="mg-study-cards" aria-label="Быстрый старт">'
        + homeStartCard('Основы чтения', 'От первой буквы до первых слов. По два коротких задания на букву.', '#reading-track')
        + homeStartCard('Мои слова', 'Найди нужные слова и собери свой список для практики.', '#my-words') + '</nav>';
    return markup.replace('</p></div>', '</p>' + link + '</div>')
        .replace('<nav class="mg-home-grid', cards + '<nav class="mg-home-grid') + readingSourcesPanel();
}

function readingDisclosure(title, html, note = '', extraClass = '') {
    const hint = note ? '<span class="nu-breakdown-note">' + esc(note) + '</span>' : '';
    return '<details class="nu-details nu-breakdown ' + extraClass + '"><summary>'
        + '<svg class="nu-breakdown-icon" width="22" height="22" viewBox="0 0 24 24" '
        + 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M12 6c-2.5-2-6-2.5-9-1.5v14c3-1 6.5-.5 9 1.5 2.5-2 6-2.5 9-1.5v-14C18 3.5 14.5 4 12 6Zm0 0v14M6 8h3m-3 4h3m6-4h3m-3 4h3"/></svg>'
        + '<span class="nu-breakdown-label"><strong>' + esc(title) + '</strong>' + hint + '</span>'
        + '<span class="nu-breakdown-chevron" aria-hidden="true"></span></summary>'
        + '<div class="nu-breakdown-content">' + html + '</div></details>';
}

const readingSourceNames = [
    ['Книги и статьи', [
        'О. Ф. Золтоева. Старописьменный монгольский язык (2007)',
        'Д. Цэрэнпил, Р. Кульман. Mongolian Grammar',
        'Н. Н. Поппе. Grammar of Written Mongolian',
        'Б. Я. Владимирцов. Сравнительная грамматика монгольского письменного языка и халхаского наречия. Введение и фонетика',
        'К. Грёнбек, Дж. Р. Крюгер. An Introduction to Classical (Literary) Mongolian',
        'Б. Золжаргал и др. Монгол бичгийн гарын авлага I (2023)',
        'Г. Д. Санжеев, М. Н. Орловская, З. В. Шевернина. Этимологический словарь монгольских языков',
        'Л. С. Пучковский. Каталог монгольских, бурят-монгольских и ойратских рукописей (1957)',
        'Монгол хэл 2. Гарын авлага',
        'Я.-У. Свантессон. Vowel Palatalization in Mongolian (1991)',
        'Batjargal et al. Traditional Mongolian Script Encodings (2011)',
        'Tana Wu. Eating and Drinking Expressions in Mongolian (2019)'
    ]],
    ['Словари и справочные сайты', [
        'Я. Цэвэл. Цахим толь',
        'Монгол хэлний их тайлбар толь',
        'Болор толь. Монгол–Орос толь',
        'SLOVARonline. Монгольско-русский словарь',
        'Журамласан толь. Монгол хэлний зөв бичих дүрэм',
        'TUFS ILCAA. Mongolic Basic Vocabulary',
        'Tohoku CNEAS. 蒙汉词典 (1999)',
        'Монгол бичгийн товч толь (1992)',
        'RKTS. Lexicographical Resources for the Mongolian Language',
        'Unicode Standard. Mongolian',
        'Kushim Jiang. Unicode Technical Note 57: Encoding and Shaping of the Mongolian Script',
        'W3C. Mongolian Layout Requirements'
    ]]
];

function readingSourcesPanel() {
    const content = readingSourceNames.map(([group, names]) =>
        '<section><h2>' + esc(group) + '</h2><ul>'
        + names.map(name => '<li>' + esc(name) + '</li>').join('')
        + '</ul></section>').join('');
    return readingDisclosure('Источники', '<div class="nu-source-list">' + content + '</div>',
        '', 'nu-reading-source-panel');
}


(() => {
    const controller = document.currentScript;
    const app = document.getElementById('app');
    const initialHome = document.getElementById('trainer-home-template');
    const loader = app.querySelector('[data-loader]');
    let started = false;
    let artwork = null;

    function showRoute() {
        const atHome = !location.hash || location.hash === '#home';
        if (atHome) {
            if (app.querySelector('.mg-home')) return;
            const home = renderReadingHome(initialHome.innerHTML, readStarterSave()?.step);
            app.innerHTML = '<header class="nu-header"><span class="nu-brand">Монгол бичиг</span></header>'
                + '<main class="main a-main site-main">' + home + '</main>';
            const image = app.querySelector('.mg-ger-art');
            if (artwork) image.replaceWith(artwork);
            else artwork = image;
            return;
        }
        if (!app.contains(loader)) app.replaceChildren(loader);
        if (started) return;
        started = true;
        const script = document.createElement('script');
        script.src = controller.dataset.trainerSrc;
        script.addEventListener('error', window.nuTrainerLoadFailed, {once: true});
        document.head.append(script);
    }

    window.nuTrainerStarted = () => {
        window.removeEventListener('hashchange', showRoute);
        initialHome.remove();
        return artwork;
    };
    window.addEventListener('hashchange', showRoute);
    showRoute();
})();

})();
</script></body></html>
